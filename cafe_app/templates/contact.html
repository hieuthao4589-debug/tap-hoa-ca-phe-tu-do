<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liên hệ - Cà Phê Tự Do</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      :root {
        --vintage-cream: #fbf3e8;
        --vintage-brown: #3b2b24;
        --vintage-orange: #c46a4a;
      }
      body {
        background-color: var(--vintage-cream);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--vintage-brown);
      }
      .contact-header {
        background:
          linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
          url("/media/banner.jpg");
        background-size: cover;
        background-position: center;
        padding: 80px 0;
        color: white;
        text-align: center;
      }
      .contact-card {
        background-color: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        height: 100%;
      }
      .icon-box {
        width: 50px;
        height: 50px;
        background-color: var(--vintage-cream);
        color: var(--vintage-orange);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        margin-right: 15px;
      }
      .form-control:focus {
        border-color: var(--vintage-orange);
        box-shadow: 0 0 0 0.25rem rgba(196, 106, 74, 0.25);
      }
      .btn-submit {
        background-color: var(--vintage-orange);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 8px;
        font-weight: bold;
        transition: 0.3s;
      }
      .btn-submit:hover {
        background-color: var(--vintage-brown);
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="contact-header mb-5">
      <div class="container">
        <h1 class="display-5 fw-bold mb-3">Liên Hệ Với Tự Do</h1>
        <p class="lead">
          Tụi mình luôn ở đây, sẵn sàng lắng nghe câu chuyện của bạn.
        </p>
        <a href="/" class="btn btn-outline-light rounded-pill mt-3"
          ><i class="fa-solid fa-arrow-left me-2"></i>Về trang chủ</a
        >
      </div>
    </div>

    <div class="container mb-5">
      <div class="row g-4">
        <div class="col-md-5">
          <div class="contact-card">
            <h3 class="fw-bold mb-4">Thông tin liên hệ</h3>

            <div class="d-flex mb-4 align-items-center">
              <div class="icon-box">
                <i class="fa-solid fa-location-dot"></i>
              </div>
              <div>
                <h6 class="fw-bold mb-1">Địa chỉ quán</h6>
                <p class="mb-0 text-muted">
                  227 Quang Trung, Gò Vấp, Hồ Chí Minh
                </p>
              </div>
            </div>

            <div class="d-flex mb-4 align-items-center">
              <div class="icon-box"><i class="fa-solid fa-phone"></i></div>
              <div>
                <h6 class="fw-bold mb-1">Điện thoại</h6>
                <p class="mb-0 text-muted">0703 332 525</p>
              </div>
            </div>

            <div class="d-flex mb-4 align-items-center">
              <div class="icon-box"><i class="fa-solid fa-envelope"></i></div>
              <div>
                <h6 class="fw-bold mb-1">Email</h6>
                <p class="mb-0 text-muted">taphoacaphe.tudo@gmail.com</p>
              </div>
            </div>

            <div class="d-flex mb-4 align-items-center">
              <div class="icon-box"><i class="fa-solid fa-clock"></i></div>
              <div>
                <h6 class="fw-bold mb-1">Giờ mở cửa</h6>
                <p class="mb-0 text-muted">6:00 - 22:00 hàng ngày</p>
              </div>
            </div>

            <div class="mt-4 pt-4 border-top">
              <h6 class="fw-bold mb-3">Theo dõi tụi mình tại:</h6>
              <a
                href="https://www.facebook.com/taphoacaphetudo"
                target="_blank"
                class="text-decoration-none me-3 fs-4"
                style="color: var(--vintage-orange)"
              >
                <i class="fa-brands fa-facebook"></i>
              </a>
              <a
                href="https://www.instagram.com/taphoacaphetudo"
                target="_blank"
                class="text-decoration-none me-3 fs-4"
                style="color: var(--vintage-orange)"
                ><i class="fa-brands fa-instagram"></i
              ></a>
              <a
                href="https://www.tiktok.com/@tudoqt_5"
                target="_blank"
                class="text-decoration-none fs-4"
                style="color: var(--vintage-orange)"
                ><i class="fa-brands fa-tiktok"></i
              ></a>
            </div>
          </div>
        </div>

        <div class="col-md-7">
          <div class="contact-card">
            <h3 class="fw-bold mb-4">Gửi lời nhắn</h3>
            <form>
              <div class="mb-3">
                <label class="form-label fw-bold">Tên của bạn</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Nhập tên của bạn"
                />
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold"
                  >Số điện thoại hoặc Email</label
                >
                <input
                  type="text"
                  class="form-control"
                  placeholder="Để tụi mình có thể phản hồi lại"
                />
              </div>
              <div class="mb-4">
                <label class="form-label fw-bold">Lời nhắn</label>
                <textarea
                  class="form-control"
                  rows="4"
                  placeholder="Bạn muốn nói gì với Tự Do?"
                ></textarea>
              </div>
              <button
                type="button"
                class="btn btn-submit w-100"
                onclick="
                  alert(
                    'Cảm ơn bạn! Tự Do đã nhận được lời nhắn và sẽ phản hồi sớm nhất nha.',
                  )
                "
              >
                Gửi lời nhắn
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
